# Size budget for the frame crate (the kernel's unsafe TCB).
#
# `cargo xtask frame-audit` (and `cargo xtask lint`, run in CI) fails if frame
# exceeds either number. Raising a budget requires an ADR that justifies the
# growth; cite it here.
#
# code_lines:   non-blank lines in kernel/frame/src that are not pure comments
# unsafe_sites: `unsafe` keyword occurrences (blocks, fns, impls, externs,
#               attributes) outside comments and strings
#
# Budget: ADR-0001, section 8 ("Frame budget"). Milestone 1 raises these in
# steps up to its ceiling of 6,000 lines / 320 sites.
# Step 1 (paging, page allocator, heap): 1,950 / 115.
# Step 2 (traps, x2APIC, timer, ACPI access, SMP, per-CPU data): 3,000 / 160.
#
# Milestone 2: ADR-0003 sets the ceiling at 7,000 / 300.
# Step 3 (tasks, context switch, atomic mode, scheduler hook): 3,700 / 170.
# Step 4 (user mode, VmSpace/UFrame, VmReader/Writer, sleeping Mutex): 4,500 / 215.
#
# Milestone 3: ADR-0005 sets the ceiling at 8,500 / 380.
# Step 5 (CPU vulnerability detection, PCI, IoMem, DmaBuf, VirtQueue): 5,100 / 235.
#
# Milestone 4: ADR-0007 sets the ceiling at 9,500 / 420.
# Step 6 (timed waits, signal-frame accessors; next: TLB shootdown, atomic
# user u32 ops for futexes): 5,800 / 250.
# Step 7 (ADR-0004 amendment of 2026-11-16: the entry area and kernel
# page-table isolation, with PCID): 6,250 / 265.
# Step 8 (ADR-0005 amendment of 2026-11-22: a device's I/O ports, for legacy
# virtio): 6,350 / 265.
# Step 9 (ADR-0015: xAPIC): 6,450 / 270.
# Step 10 (ADR-0016: Hyper-V's hypercalls and SynIC): 6,600 / 285.
# Step 11 (ADR-0017: the ACPI power button and S5): 6,700 / 290.
# Step 12 (ADR-0018: kvmclock is the clock on KVM): 6,850 / 295.
# Step 13 (ADR-0004's 2026-11-23 amendment: branch history cleared on
# entry, IBPB on entry, AutoIBRS, RSB filling, masked indices): 7,000 / 300.
# Step 14 (ADR-0004's safe-RET amendment of 2026-11-23: return thunks, and
# AMD's IBRS bit before them): 7,250 / 310.
# Step 15 (ADR-0019: console writes buffered, drained by a task): 7,350 / 310.
# Step 16 (ADR-0008's 2026-11-25 amendment: no restore of registers that hold
# the state, sysretq, the FS base cached, a VmSpace without a page tree, batch
# write protection): 7,450 / 310.
# Step 17 (ADR-0020: 2 MiB pages for anonymous memory, split on partial
# changes): 7,650 / 310.
# Step 18 (ADR-0021: each task's time on a CPU, kept at context switches):
# 7,700 / 310.
# Step 19 (ADR-0008's 2026-11-26 amendment: user registers saved when the
# task switches out or software needs them, not after every trap):
# 7,800 / 315.
# Step 20 (ADR-0022: protection keys: CR4.PKE, PKRU saved with the rest,
# keys in user PTEs): 7,850 / 315.
# Step 21 (ADR-0023: AMX tile data behind XFD, per-thread area sizes):
# 8,000 / 315.
# Step 22 (ADR-0004's 2026-11-27 amendment: retpolines on AMD in place of
# IBRS on entry, the entry code at its image address, mapped in shadow
# roots under isolation): 8,100 / 320.
# Step 23 (ADR-0004's second 2026-11-27 amendment: ITS, TSA, STIBP,
# speculative store bypass by prctl; TAA, GDS and MMIO stale data tested as
# Linux tests them): 8,350 / 325.
# Step 24 (ADR-0024: boot timed from frame's entry, Firecracker's boot-timer
# port, PCI enumeration through bridges, only the console task writing to
# the port, APs started without the MP Specification's delays): 8,450 / 325.
# Step 25 (ADR-0025: the PVH entry, a 32-bit stub and the start info read
# into the boot state): 8,800 / 330.
max_code_lines = 8800
max_unsafe_sites = 330
