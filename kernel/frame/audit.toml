# Size budget for the frame crate (the kernel's unsafe TCB).
#
# `cargo xtask frame-audit` (and `cargo xtask lint`, run in CI) fails if frame
# exceeds either number. Raising a budget requires an ADR that justifies the
# growth; cite it here.
#
# code_lines:   non-blank lines in kernel/frame/src that are not pure comments
# unsafe_sites: `unsafe` keyword occurrences (blocks, fns, impls, externs,
#               attributes) outside comments and strings
#
# Budget: ADR-0001, section 8 ("Frame budget"). Milestone 1 raises these in
# steps up to its ceiling of 6,000 lines / 320 sites.
# Step 1 (paging, page allocator, heap): 1,950 / 115.
# Step 2 (traps, x2APIC, timer, ACPI access, SMP, per-CPU data): 3,000 / 160.
max_code_lines = 3000
max_unsafe_sites = 160
