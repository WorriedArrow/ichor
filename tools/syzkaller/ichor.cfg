{
	"name": "ichor",
	"target": "linux/amd64",
	"http": "0.0.0.0:56741",
	"workdir": "/home/syz/workdir",
	"syzkaller": "/home/syz/syzkaller",
	"image": "/home/syz/ichor/ichor-disk.img",
	"sshkey": "/home/syz/syzkey",
	"ssh_user": "root",
	"procs": 2,
	"cover": false,
	"sandbox": "none",
	"reproduce": true,
	"type": "qemu",
	"vm": {
		"count": 4,
		"cpu": 2,
		"mem": 3072,
		"qemu": "qemu-system-x86_64",
		"qemu_args": "-enable-kvm -cpu host,migratable=off -machine q35 -bios /usr/share/ovmf/OVMF.fd -drive index=1,file=/home/syz/ichor/autorun.img,if=virtio,format=raw,readonly=on",
		"image_device": "drive index=0,media=disk,if=virtio,format=raw,file=",
		"network_device": "virtio-net-pci",
		"snapshot": true
	}
}
