[package]
name = "xtask"
description = "Build, image, run, test and bench tooling for Ichor (host only)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "xtask"
path = "src/lib.rs"

[[bin]]
name = "xtask"
path = "src/main.rs"
test = false

[dependencies]
# Builds the root disk image each QEMU run boots with (a path crate, no
# external code).
image = { workspace = true, features = ["builder"] }
# Builds the benchmark programs for the Linux reference boot, the same
# bytes the kernel runs (a path crate, no external code).
testprog.workspace = true
# Writes the GPT of a bootable disk image (a path crate, no external code).
gpt = { workspace = true, features = ["builder"] }
# Reads the kernel's PE headers to lay it out for PVH loaders (a path
# crate, no external code).
pe.workspace = true
# gzip'd tar layers into images, shared with the control plane (a path
# crate, no external code).
layer.workspace = true
# Scores certificate path validation against x509-limbo (path crates, no
# external code).
x509.workspace = true
oci.workspace = true
# Runs Wycheproof's ML-DSA vectors (a path crate, no external code).
crypto.workspace = true
civil.workspace = true
# The control plane's API, from the host (tests, `cargo xtask workloads`).
grpc.workspace = true
tls.workspace = true

[lints]
workspace = true
