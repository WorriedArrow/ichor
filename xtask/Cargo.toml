[package]
name = "xtask"
description = "Build, image, run, test and bench tooling for Ichor (host only)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "xtask"
path = "src/lib.rs"

[[bin]]
name = "xtask"
path = "src/main.rs"
test = false

[dependencies]
# Builds the root disk image each QEMU run boots with (a path crate, no
# external code).
image = { workspace = true, features = ["builder"] }
# Builds the benchmark programs for the Linux reference boot, the same
# bytes the kernel runs (a path crate, no external code).
testprog.workspace = true
# Writes the GPT of a bootable disk image (a path crate, no external code).
gpt = { workspace = true, features = ["builder"] }

[lints]
workspace = true
