# Ichor builds on a pinned *stable* toolchain. The kernel build alone takes
# two unstable flags through RUSTC_BOOTSTRAP (return thunks, and the
# standard library rebuilt with them from rust-src); AGENTS.md, "Unstable
# features", says which and why.
[toolchain]
channel = "1.100.0"
components = ["rustfmt", "clippy", "rust-src"]
# x86_64-unknown-none: the native-ABI services (services/rt, ADR-0012).
targets = ["x86_64-unknown-uefi", "x86_64-unknown-none"]
profile = "minimal"
