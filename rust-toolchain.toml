# Ichor builds on a pinned *stable* toolchain. No unstable features are used.
# If a feature ever requires nightly, pin a dated nightly here and record the
# feature and the reason in AGENTS.md ("Unstable features").
[toolchain]
channel = "1.100.0"
components = ["rustfmt", "clippy", "rust-src"]
# x86_64-unknown-none: the native-ABI services (services/rt, ADR-0012).
targets = ["x86_64-unknown-uefi", "x86_64-unknown-none"]
profile = "minimal"
