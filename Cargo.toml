[workspace]
resolver = "3"
members = [
    "kernel/frame",
    "kernel/cmdline",
    "kernel/pe",
    "kernel/buddy",
    "kernel/acpi",
    "kernel/sched",
    "kernel/cap",
    "kernel/cell",
    "kernel/abi",
    "kernel/elf",
    "kernel/image",
    "kernel/block",
    "kernel/vma",
    "kernel/overlay",
    "kernel/csprng",
    "kernel/civil",
    "kernel/blake3",
    "kernel/testprog",
    "kernel/gpt",
    "kernel/net",
    "kernel/uring",
    "kernel/vmbus",
    "kernel/ena",
    "kernel/gve",
    "kernel/drivers/virtio-pci",
    "kernel/drivers/virtio-blk",
    "kernel/drivers/virtio-rng",
    "kernel/drivers/virtio-net",
    "kernel/drivers/intel-gbe",
    "kernel/drivers/nvme",
    "kernel/drivers/virtio-scsi",
    "kernel/drivers/hyperv",
    "kernel/drivers/ena",
    "kernel/drivers/gve",
    "kernel/ichor",
    "services/crypto",
    "services/x509",
    "services/tls",
    "services/layer",
    "services/http",
    "services/oci",
    "services/dns",
    "services/grpc",
    "services/rt",
    "services/nativetest",
    "services/control",
    "fuzz",
    "tests",
    "xtask",
]
# Plain `cargo build` / `cargo test` on the host only touches crates that make
# sense on the host. The kernel binary and the frame crate are built for
# x86_64-unknown-uefi by `cargo xtask build`.
default-members = [
    "kernel/cmdline",
    "kernel/pe",
    "kernel/buddy",
    "kernel/acpi",
    "kernel/sched",
    "kernel/cap",
    "kernel/cell",
    "kernel/abi",
    "kernel/elf",
    "kernel/image",
    "kernel/block",
    "kernel/vma",
    "kernel/overlay",
    "kernel/csprng",
    "kernel/civil",
    "kernel/blake3",
    "kernel/testprog",
    "kernel/gpt",
    "kernel/net",
    "kernel/uring",
    "kernel/vmbus",
    "kernel/ena",
    "kernel/gve",
    "services/crypto",
    "services/x509",
    "services/tls",
    "services/layer",
    "services/http",
    "services/oci",
    "services/dns",
    "services/grpc",
    "fuzz",
    "tests",
    "xtask",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "FSL-1.1-ALv2"
publish = false

[workspace.dependencies]
frame = { package = "ichor-frame", path = "kernel/frame" }
cmdline = { package = "ichor-cmdline", path = "kernel/cmdline" }
pe = { package = "ichor-pe", path = "kernel/pe" }
buddy = { package = "ichor-buddy", path = "kernel/buddy" }
acpi = { package = "ichor-acpi", path = "kernel/acpi" }
sched = { package = "ichor-sched", path = "kernel/sched" }
cap = { package = "ichor-cap", path = "kernel/cap" }
cell = { package = "ichor-cell", path = "kernel/cell" }
ichor-abi = { path = "kernel/abi" }
elf = { package = "ichor-elf", path = "kernel/elf" }
image = { package = "ichor-image", path = "kernel/image" }
block = { package = "ichor-block", path = "kernel/block" }
vma = { package = "ichor-vma", path = "kernel/vma" }
overlay = { package = "ichor-overlay", path = "kernel/overlay" }
csprng = { package = "ichor-csprng", path = "kernel/csprng" }
civil = { package = "ichor-civil", path = "kernel/civil" }
blake3 = { package = "ichor-blake3", path = "kernel/blake3" }
testprog = { package = "ichor-testprog", path = "kernel/testprog" }
gpt = { package = "ichor-gpt", path = "kernel/gpt" }
virtio-pci = { package = "ichor-virtio-pci", path = "kernel/drivers/virtio-pci" }
virtio-rng = { package = "ichor-virtio-rng", path = "kernel/drivers/virtio-rng" }
virtio-net = { package = "ichor-virtio-net", path = "kernel/drivers/virtio-net" }
intel-gbe = { package = "ichor-intel-gbe", path = "kernel/drivers/intel-gbe" }
net = { package = "ichor-net", path = "kernel/net" }
uring = { package = "ichor-uring", path = "kernel/uring" }
vmbus = { package = "ichor-vmbus", path = "kernel/vmbus" }
virtio-blk = { package = "ichor-virtio-blk", path = "kernel/drivers/virtio-blk" }
nvme = { package = "ichor-nvme", path = "kernel/drivers/nvme" }
virtio-scsi = { package = "ichor-virtio-scsi", path = "kernel/drivers/virtio-scsi" }
hyperv = { package = "ichor-hyperv", path = "kernel/drivers/hyperv" }
ena = { package = "ichor-ena", path = "kernel/ena" }
ena-driver = { package = "ichor-ena-driver", path = "kernel/drivers/ena" }
gve = { package = "ichor-gve", path = "kernel/gve" }
gve-driver = { package = "ichor-gve-driver", path = "kernel/drivers/gve" }
crypto = { package = "ichor-crypto", path = "services/crypto" }
x509 = { package = "ichor-x509", path = "services/x509" }
layer = { package = "ichor-layer", path = "services/layer" }
http = { package = "ichor-http", path = "services/http" }
tls = { package = "ichor-tls", path = "services/tls" }
rt = { package = "ichor-rt", path = "services/rt" }
grpc = { package = "ichor-grpc", path = "services/grpc" }
oci = { package = "ichor-oci", path = "services/oci" }
dns = { package = "ichor-dns", path = "services/dns" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
missing_safety_doc = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "warn"

[profile.dev]
panic = "abort"
opt-level = 1

[profile.release]
panic = "abort"
lto = "fat"
codegen-units = 1
debug = "line-tables-only"

# The native services in release builds (xtask's `build::services`):
# release without LTO, which cannot mix their small code model with the
# kernel code model of x86_64-unknown-none's prebuilt core and alloc.
[profile.services-release]
inherits = "release"
lto = false
