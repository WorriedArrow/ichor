name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: lint (fmt, clippy, unsafe policy, frame budget)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask lint

  conformance:
    name: parsers (fuzzing) and certificate validation (x509-limbo)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Cache the x509-limbo suite (hash-checked by xtask)
        uses: actions/cache@v4
        with:
          path: target/x509-limbo
          key: x509-limbo-519f4bcf
      # Fails below the floors in xtask/src/limbo.rs; the report is the
      # job summary.
      - run: cargo xtask x509-limbo && cat docs/x509-limbo.md >> "$GITHUB_STEP_SUMMARY"
      - run: cargo xtask fuzz --iterations 20000
      - name: Keep inputs that broke a parser
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes
          path: target/fuzz/
          if-no-files-found: ignore

  test:
    name: test (host units + QEMU/OVMF boot)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Install QEMU and OVMF
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 ovmf
      - name: Enable KVM for the runner user
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm || echo "no /dev/kvm; tests fall back to TCG"
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Cache test artifacts (hash-checked by xtask on every use)
        uses: actions/cache@v4
        with:
          path: |
            target/busybox
            target/alpine
            target/alpine-pkgs
            target/debian
          key: artifacts-busybox-1.35.0-alpine-3.20.3-pkgs-1-debian-dd051e1b8c92
      # Its own entry, so adding it did not invalidate the cache above (whose
      # branch packages may no longer be downloadable).
      - name: Cache the Linux reference kernel (hash-checked by xtask)
        uses: actions/cache@v4
        with:
          path: target/alpine-kernel
          key: linux-virt-6.6.142-r0
      - name: Cache the CA bundle (hash-checked by xtask)
        uses: actions/cache@v4
        with:
          path: target/roots
          key: mozilla-roots-2026-11-05
      - run: cargo xtask test
        env:
          ICHOR_TEST_VERBOSE: "1"
          ICHOR_REQUIRE_KVM: "1"
      # Phase E: Ichor and a pinned Linux (Alpine linux-virt) on the same
      # machine and programs, one boot at a time so parallel test boots do
      # not disturb the numbers. Printed and summarized, not checked.
      - name: Benchmarks against Linux (KVM, 4 vCPUs)
        shell: bash
        run: |
          cargo xtask bench --accel kvm --smp 4 --timeout 900 | tee bench.md
          { echo '### Benchmarks: Ichor vs Linux (KVM, 4 vCPUs)'; echo
            cat bench.md; } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload QEMU run directories on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: qemu-runs
          path: target/qemu/
          if-no-files-found: ignore

  deny:
    name: cargo-deny (licenses, advisories, sources)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: cargo deny check
